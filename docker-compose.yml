name: forno

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: forno
      POSTGRES_USER: forno
      POSTGRES_PASSWORD: forno
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forno -d forno"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
    environment:
      DATABASE_URL: "postgresql://forno:forno@database:5432/forno?serverVersion=17&charset=utf8"
      REDIS_URL: "redis://redis:6379"
    volumes:
      - ./backend:/var/www/backend
      # vendor/ e var/ (cache, logs, sessões) ficam em volumes Docker: no
      # Windows/macOS o bind mount é lento demais para os milhares de arquivos
      # lidos a cada requisição. Rode `composer install` dentro do container.
      - backend-vendor:/var/www/backend/vendor
      - backend-var:/var/www/backend/var
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_HMR_CLIENT_PORT: "8080"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/backend/public:ro
    depends_on:
      - backend
      - frontend

volumes:
  backend-vendor:
  backend-var:
  db-data:
  frontend-node-modules:
