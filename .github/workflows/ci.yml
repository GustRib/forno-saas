name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PHP 8.4 / Symfony)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: forno
          POSTGRES_USER: forno
          POSTGRES_PASSWORD: forno
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U forno -d forno"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://forno:forno@127.0.0.1:5432/forno?serverVersion=17&charset=utf8
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl, pdo_pgsql, bcmath, zip, redis
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - run: composer install --no-interaction --no-progress --prefer-dist

      - name: Estilo de código (PHP CS Fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Container e mapeamento
        run: |
          bin/console cache:warmup
          bin/console lint:container
          bin/console doctrine:schema:validate --skip-sync

      - name: Análise estática (PHPStan)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Migrations sobem e descem
        run: |
          bin/console doctrine:database:create --if-not-exists -n
          bin/console doctrine:migrations:migrate -n
          bin/console doctrine:migrations:migrate first -n
          bin/console doctrine:migrations:migrate -n

      - name: Testes (PHPUnit)
        run: vendor/bin/phpunit

  frontend:
    name: Frontend (Vue 3 / TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Tipos (vue-tsc)
        run: npm run type-check
      - name: Testes (Vitest)
        run: npm test
      - name: Build
        run: npx vite build
