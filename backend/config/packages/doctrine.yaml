doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        auto_mapping: false
        # Cada módulo mapeia suas próprias entidades (monólito modular).
        mappings:
            Identity:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Identity/Domain/Model'
                prefix: 'App\Identity\Domain\Model'
            Tenant:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Tenant/Domain/Model'
                prefix: 'App\Tenant\Domain\Model'
            Catalog:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Catalog/Domain/Model'
                prefix: 'App\Catalog\Domain\Model'
            Inventory:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Inventory/Domain/Model'
                prefix: 'App\Inventory\Domain\Model'
            Recipe:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Recipe/Domain/Model'
                prefix: 'App\Recipe\Domain\Model'

when@test:
    doctrine:
        dbal:
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
